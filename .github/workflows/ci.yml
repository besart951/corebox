name: foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation_test
          POSTGRES_DB: foundation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FOUNDATION_TEST_DATABASE_URL: postgresql+psycopg://postgres:foundation_test@localhost:5432/foundation_test
      FOUNDATION_DATABASE_URL: postgresql+psycopg://postgres:foundation_test@localhost:5432/foundation_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          allow-prereleases: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run alembic upgrade heads
      - run: uv run alembic check
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/check_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
