services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: foundation
      POSTGRES_DB: foundation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - foundation-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation -d foundation"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  foundation-postgres:
